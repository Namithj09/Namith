<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2a2050"/>
      <stop offset="60%" stop-color="#150f30"/>
      <stop offset="100%" stop-color="#0a0718"/>
    </radialGradient>
    <linearGradient id="suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3650"/>
      <stop offset="100%" stop-color="#1f1d2e"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#d8d4ec"/>
    </linearGradient>
    <linearGradient id="skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c8956d"/>
      <stop offset="100%" stop-color="#8a5d3a"/>
    </linearGradient>
    <radialGradient id="faceLight" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#d9a47a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8a5d3a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Subtle vignette -->
  <radialGradient id="vig" cx="50%" cy="50%" r="60%">
    <stop offset="60%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="800" height="1000" fill="url(#vig)"/>

  <!-- Silhouette / shoulders / suit -->
  <g filter="url(#soft)">
    <!-- Shoulders -->
    <path d="M 130 1000 L 130 780 Q 200 700 280 670 L 520 670 Q 600 700 670 780 L 670 1000 Z" fill="url(#suit)"/>
    <!-- Inner shirt V -->
    <path d="M 340 670 L 400 870 L 460 670 L 460 1000 L 340 1000 Z" fill="url(#shirt)"/>
    <!-- Shirt collar -->
    <path d="M 340 670 L 360 720 L 400 740 L 440 720 L 460 670 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Lapel left -->
    <path d="M 280 670 L 340 670 L 380 1000 L 320 1000 Z" fill="#252339"/>
    <!-- Lapel right -->
    <path d="M 460 670 L 520 670 L 480 1000 L 420 1000 Z" fill="#252339"/>
    <!-- Buttons -->
    <circle cx="400" cy="780" r="6" fill="#0a0718" stroke="#3a3650" stroke-width="1"/>
    <circle cx="400" cy="860" r="6" fill="#0a0718" stroke="#3a3650" stroke-width="1"/>
    <circle cx="400" cy="940" r="6" fill="#0a0718" stroke="#3a3650" stroke-width="1"/>
  </g>

  <!-- Neck -->
  <path d="M 360 580 L 360 680 Q 400 700 440 680 L 440 580 Z" fill="url(#skin)"/>

  <!-- Head -->
  <ellipse cx="400" cy="420" rx="135" ry="170" fill="url(#skin)"/>
  <ellipse cx="400" cy="420" rx="135" ry="170" fill="url(#faceLight)"/>

  <!-- Hair -->
  <path d="M 270 380 Q 280 240 400 230 Q 520 240 530 380 Q 530 320 500 290 Q 460 260 400 258 Q 340 260 300 290 Q 270 320 270 380 Z" fill="#1a1428"/>
  <path d="M 275 360 Q 290 320 320 300 Q 360 280 400 278 Q 440 280 480 300 Q 510 320 525 360 Q 510 295 470 275 Q 430 260 400 260 Q 370 260 330 275 Q 290 295 275 360 Z" fill="#0f0a1a" opacity="0.6"/>

  <!-- Glasses frames -->
  <g stroke="#1a1428" stroke-width="3" fill="none">
    <circle cx="355" cy="420" r="38"/>
    <circle cx="445" cy="420" r="38"/>
    <line x1="393" y1="420" x2="407" y2="420"/>
    <line x1="317" y1="420" x2="295" y2="415"/>
    <line x1="483" y1="420" x2="505" y2="415"/>
  </g>
  <!-- Glasses lenses tint -->
  <circle cx="355" cy="420" r="36" fill="#9b86ff" opacity="0.06"/>
  <circle cx="445" cy="420" r="36" fill="#9b86ff" opacity="0.06"/>
  <!-- Glasses highlight -->
  <ellipse cx="345" cy="410" rx="10" ry="4" fill="#ffffff" opacity="0.25"/>
  <ellipse cx="435" cy="410" rx="10" ry="4" fill="#ffffff" opacity="0.25"/>

  <!-- Bindi -->
  <circle cx="400" cy="358" r="3" fill="#c0392b"/>

  <!-- Eyebrows -->
  <path d="M 325 388 Q 355 378 385 388" stroke="#1a1428" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 415 388 Q 445 378 475 388" stroke="#1a1428" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Eyes (behind glasses) -->
  <ellipse cx="355" cy="420" rx="8" ry="6" fill="#1a1428"/>
  <ellipse cx="445" cy="420" rx="8" ry="6" fill="#1a1428"/>
  <circle cx="357" cy="418" r="2" fill="#ffffff"/>
  <circle cx="447" cy="418" r="2" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M 400 430 Q 395 470 390 490 Q 400 498 410 490 Q 405 470 400 430" fill="none" stroke="#5a3a20" stroke-width="1.5" opacity="0.4"/>

  <!-- Mustache -->
  <path d="M 360 510 Q 380 505 400 510 Q 420 505 440 510 Q 430 522 400 525 Q 370 522 360 510 Z" fill="#1a1428"/>

  <!-- Mouth (slight smile) -->
  <path d="M 375 540 Q 400 552 425 540" stroke="#5a2a20" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 380 545 Q 400 555 420 545 L 420 548 Q 400 558 380 548 Z" fill="#5a2a20" opacity="0.4"/>

  <!-- Ears -->
  <ellipse cx="265" cy="425" rx="14" ry="28" fill="url(#skin)"/>
  <ellipse cx="535" cy="425" rx="14" ry="28" fill="url(#skin)"/>

  <!-- Hands at the suit (buttoning gesture) -->
  <g filter="url(#soft)">
    <ellipse cx="350" cy="830" rx="55" ry="40" fill="url(#skin)"/>
    <ellipse cx="450" cy="850" rx="55" ry="40" fill="url(#skin)"/>
    <!-- Sleeve cuffs -->
    <path d="M 295 815 Q 350 800 405 815 L 405 840 Q 350 825 295 840 Z" fill="#e8e4f5"/>
    <path d="M 395 835 Q 450 820 505 835 L 505 860 Q 450 845 395 860 Z" fill="#e8e4f5"/>
  </g>

  <!-- Rim light on face -->
  <path d="M 275 350 Q 285 280 340 250" stroke="#9b86ff" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- Name label -->
  <text x="400" y="975" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="14" fill="#9b86ff" opacity="0.5" letter-spacing="3">NAMITH J</text>
</svg>
